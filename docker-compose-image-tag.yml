x-superset-image: &superset-image apachesuperset.docker.scarf.sh/apache/superset:${TAG:-latest-dev}
x-superset-volumes:
  &superset-volumes
  - ./docker:/app/docker
  - ./superset-core:/app/superset-core # Needed for dev/latest-dev tags
  - superset_home:/app/superset_home
  - delta-volume:/delta # Allow Superset to see the data folder if needed locally

# MTA Lakehouse Architecture
#
# Ingestion
#   └─ polls MTA GTFS-Realtime
#   └─ writes raw JSONL files
#   └─ output → raw-volume (/data/raw)
#
# Marimo (Bronze / Silver processing)
#   ├─ reads raw JSONL ← raw-volume
#   ├─ transforms & enriches data
#   └─ writes Delta Lake tables → delta-volume (/delta)
#
# Spark Thrift (delta-query)
#   ├─ reads Delta tables from delta-volume
#   ├─ uses Hive Metastore for table metadata
#   └─ exposes SQL endpoint (HiveServer2 / Thrift)
#
# Superset (BI / Visualization)
#   └─ connects to Spark Thrift / Hive
#   └─ queries Delta tables for dashboards & charts
#
# Data flow:
#   Ingestion → raw-volume → Marimo → delta-volume → Spark Thrift → Superset
#
# Volumes:
#   raw-volume   : append-only raw ingestion (JSONL)
#   delta-volume : curated Delta Lake tables

services:
  ingestion:
    image: ghcr.io/cynicdog/uptown-downtown/ingestion:latest
    container_name: mta_ingestion
    volumes:
      - raw-volume:/data/raw
    environment:
      - RAW_BASE_PATH=/data/raw
      - POLL_INTERVAL_SECONDS=30
    restart: on-failure

  hive-metastore-db:
    image: postgres:13
    container_name: hive_metastore_db
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: your_metastore_password
      POSTGRES_DB: metastore
    volumes:
      - metastore_db_home:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hive -d metastore" ]
      interval: 5s

  hive-metastore-service:
    image: apache/hive:3.1.3
    container_name: hive_metastore_service
    depends_on:
      hive-metastore-db:
        condition: service_healthy
    volumes:
      - ./docker/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./docker/jars/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar
    entrypoint: >
      bash -c "
        export CLASSPATH=$CLASSPATH:/opt/hive/lib/postgresql-42.7.3.jar
        /opt/hive/bin/schematool -dbType postgres -initSchema -url jdbc:postgresql://hive-metastore-db:5432/metastore -userName hive -passWord your_metastore_password || echo 'Schema exists'
        exec /opt/hive/bin/hive --service metastore
      "
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9083'"]

  marimo:
    image: ghcr.io/cynicdog/marimo:spark
    container_name: marimo
    ports:
      - "8080:8080"
    volumes:
      - raw-volume:/data/raw
      - delta-volume:/delta
    environment:
      - JAVA_HOME=/usr/lib/jvm/java-21-openjdk-arm64
      - RAW_BASE_PATH=/data/raw
      - DELTA_BASE_PATH=/delta
    restart: unless-stopped

  delta-query:
    image: apache/spark:3.5.1
    container_name: delta-query
    ports:
      - "10000:10000"
    volumes:
      - delta-volume:/delta
      - ./docker/jars:/opt/spark/extra-jars
      - ./docker/hive-site.xml:/opt/spark/conf/hive-site.xml
    depends_on:
      hive-metastore-service:
        condition: service_healthy
    entrypoint: |
      bash -c '
        /opt/spark/sbin/start-thriftserver.sh \
          --master local[*] \
          --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension \
          --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog \
          --conf spark.sql.catalogImplementation=hive \
          --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore-service:9083 \
          --conf spark.driver.extraClassPath=/opt/spark/extra-jars/* \
          --conf hive.server2.thrift.bind.host=0.0.0.0 &
        sleep infinity
      '

  db:
    image: postgres:15
    container_name: superset_db
    env_file:
      - path: docker/.env
        required: true
    volumes:
      - db_home:/var/lib/postgresql/data
      - ./docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    container_name: superset_cache

  superset:
    image: *superset-image
    container_name: superset_app
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    user: "root"
    ports:
      - 8088:8088
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes
    env_file:
      - path: docker/.env
        required: true

  superset-init:
    image: *superset-image
    container_name: superset_init
    command: ["/app/docker/docker-init.sh"]
    user: "root"
    volumes: *superset-volumes
    env_file:
      - path: docker/.env
        required: true

  superset-worker:
    image: *superset-image
    container_name: superset_worker
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    user: "root"
    volumes: *superset-volumes
    env_file:
      - path: docker/.env
        required: true

  superset-worker-beat:
    image: *superset-image
    container_name: superset_worker_beat
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    user: "root"
    volumes: *superset-volumes
    env_file:
      - path: docker/.env
        required: true

volumes:
  raw-volume:
  delta-volume:
  superset_home:
  db_home: # Superset Metadata
  metastore_db_home: # Hive Metastore Metadata
  redis:
